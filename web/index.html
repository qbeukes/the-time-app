<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#050810">

    <title>The Time App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section class="hero">

            <div class="logo-wrap">
                <img class="logo" src="the-time-app-because-time-is-of-the-essence-1024x500.png"
                    alt="The Time App — because Time is of the Essence.">
            </div>

            <div class="content">

                <p class="intro">
                    A different way to experience
                    <span class="accent">time</span>.
                </p>

                <div class="actions">

                    <div class="actions-row actions-row-primary">
                        <a class="button button-primary" href="history.html">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                            </svg>

                            About 12TRA
                        </a>

                        <a href="javascript:void(0)" class="button button-primary" id="intro-video-btn"
                            onclick="openVideoModal()">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polygon points="10 8 16 12 10 16 10 8"></polygon>
                            </svg>

                            Short AI Video Introduction
                        </a>

                        <a class="button button-primary" href="hypothesis.html">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="8"></circle>
                                <path d="M12 7v5l3 2"></path>
                            </svg>

                            An Hypothesis of Time/Change
                        </a>
                    </div>

                    <div class="actions-row actions-row-secondary">
                        <a class="button" href="https://play.google.com/store/apps/details?id=myceliapp.the_time_app"
                            target="_blank">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 3v12"></path>
                                <path d="m7 10 5 5 5-5"></path>
                                <path d="M5 21h14"></path>
                            </svg>

                            Install via Play Store<br>
                            (Approved Testers Only)
                        </a>

                        <a class="button" href="https://github.com/qbeukes/the-time-app" target="_blank"
                            rel="noopener noreferrer">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4">
                                </path>
                                <path d="M9 18c-4.51 2-5-2-7-2"></path>
                            </svg>

                            View on Github

                    </div>

                </div>

                <div class="secondary-actions">
                    <a class="link-subtle" href="privacy.html">
                        Privacy Policy

                </div>

            </div>

        </section>
    </main>

    <footer>
        THE TIME APP
        <span class="accent">·</span>
        TIME IS OF THE ESSENCE
    </footer>

    <!-- YouTube Video Modal -->
    <div id="video-modal" class="video-modal" role="dialog" aria-modal="true" aria-label="Introductory Video"
        onclick="closeVideoModal(event)">
        <div class="video-modal-inner">
            <button class="video-modal-close" onclick="closeVideoModal()" aria-label="Close video">&times;</button>
            <div class="video-embed-wrap">
                <iframe id="video-iframe" src="" title="The Time App — Introductory Video" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <script>
        const VIDEO_URL = 'https://www.youtube.com/embed/PFSLQB5Hj9w?autoplay=1&rel=0';

        function openVideoModal() {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('video-iframe');
            iframe.src = VIDEO_URL;
            modal.classList.add('is-open');
            document.body.style.overflow = 'hidden';
            // Push hash into URL so the link is shareable
            history.pushState(null, '', '/#introvideo');
        }

        function closeVideoModal(event) {
            if (event && event.target !== event.currentTarget && !event.target.classList.contains('video-modal-close')) return;
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('video-iframe');
            modal.classList.remove('is-open');
            iframe.src = '';
            document.body.style.overflow = '';
            // Remove the hash without adding a history entry
            history.replaceState(null, '', '/');
        }

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('video-modal').classList.contains('is-open')) {
                closeVideoModal({ target: document.getElementById('video-modal'), currentTarget: document.getElementById('video-modal') });
            }
        });

        // Handle browser back button closing the modal
        window.addEventListener('popstate', () => {
            const modal = document.getElementById('video-modal');
            if (modal.classList.contains('is-open') && window.location.hash !== '#introvideo') {
                modal.classList.remove('is-open');
                document.getElementById('video-iframe').src = '';
                document.body.style.overflow = '';
            }
        });

        // Auto-open on page load if #introvideo is in the URL
        if (window.location.hash === '#introvideo') {
            document.addEventListener('DOMContentLoaded', openVideoModal);
        }
    </script>


</body>

</html>
